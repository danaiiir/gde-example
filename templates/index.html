<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Assistant</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script id="quotaData" type="application/json">{{ quota | tojson }}</script>
  <script id="limitsData" type="application/json">{{ limits | tojson }}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    try {
      const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem('sidebar') === 'closed') document.documentElement.classList.add('sidebar-collapsed');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="sidebarToggle" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <div class="sidebar-top-right">
          <button class="icon-btn" id="searchToggle" title="Search chats" aria-label="Search chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" data-action="new-chat" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
      </div>

      <button class="brand-row" data-action="new-chat">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>
        </span>
        <span>New chat</span>
      </button>

      <div class="search-wrap" id="searchWrap" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search chats…" autocomplete="off">
      </div>

      <nav class="history" id="history" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button class="footer-btn" id="settingsBtn" aria-label="Account menu">
          <span class="user-avatar">{{ user.username[:1] | upper }}<span class="status-dot" id="statusDot"></span></span>
          <span class="footer-text">
            <span class="footer-title" id="userName">{{ user.username }}</span>
            <span class="footer-sub">{{ model_id }}</span>
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- ============ Main ============ -->
    <main class="main" id="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn show-when-collapsed" id="sidebarOpen" title="Open sidebar" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
          <button class="icon-btn show-when-collapsed" data-action="new-chat" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <div class="model-label">Nova <span>· Bedrock</span></div>
        </div>
        <div class="topbar-title" id="chatTitle"></div>
        <div class="topbar-right">
          <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          </button>
          <button class="icon-btn" id="convMenuBtn" title="Conversation options" aria-label="Conversation options" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </button>
        </div>
      </header>

      <section class="thread" id="thread">
        <div class="thread-inner" id="messages"></div>
      </section>

      <!-- Empty state (composer is moved here when no messages, ChatGPT-style) -->
      <div class="empty" id="empty">
        <h1 class="empty-title">What can I help with?</h1>
        <div id="emptyComposerSlot"></div>
        <div class="suggestions">
          <button class="chip" data-prompt="Explain how large language models work in simple terms.">💡 Explain a concept</button>
          <button class="chip" data-prompt="Write a Python function that checks whether a string is a palindrome, with tests.">🧑‍💻 Write code</button>
          <button class="chip" data-prompt="Draft a polite email asking my manager for a day off next Friday.">✉️ Draft an email</button>
          <button class="chip" data-prompt="Plan a 3-day itinerary for a first visit to Paris.">🗺️ Plan a trip</button>
          <button class="chip" data-prompt="Summarize the key ideas of the book 'Atomic Habits'.">📚 Summarize a book</button>
        </div>
      </div>

      <footer class="composer-dock" id="composerDock">
        <form class="composer" id="composer">
          <div class="limit-banner" id="limitBanner" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div>
              <strong>You've used all your free messages</strong>
              <span id="limitBannerText">Contact the administrator to get more.</span>
            </div>
          </div>
          <textarea id="input" rows="1" placeholder="Message Nova" autocomplete="off" maxlength="{{ limits.max_input_chars }}"></textarea>
          <div class="composer-row">
            <span class="quota-pill" id="quotaPill" hidden></span>
            <span class="char-count" id="charCount" hidden></span>
            <span class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send" disabled>
              <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer" id="disclaimer">Nova can make mistakes. Check important info.</p>
      </footer>
    </main>
  </div>

  <!-- Popover menu (shared) -->
  <div class="menu" id="menu" role="menu" hidden></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn btn-danger" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <!-- Change password modal -->
  <div class="modal-backdrop" id="pwModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
      <h2 id="pwTitle">Change password</h2>
      <form id="pwForm" novalidate>
        <input type="password" name="current" placeholder="Current password" autocomplete="current-password" required>
        <input type="password" name="new" placeholder="New password (min. 8 characters)" autocomplete="new-password" required minlength="8">
        <input type="password" name="confirm" placeholder="Confirm new password" autocomplete="new-password" required>
        <p class="form-error" id="pwError"></p>
      </form>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pwCancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="pwSave" type="button">Update password</button>
      </div>
    </div>
  </div>

  <form id="logoutForm" method="post" action="{{ url_for('auth.logout') }}" hidden>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
