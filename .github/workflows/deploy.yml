# Build -> test -> push to ECR -> deploy to EC2, on every push to main.
#
# AWS access uses GitHub OIDC (no stored AWS keys). The IAM role only trusts
# pushes to main of danaiiir/gde-example. The EC2 deploy runs through SSM Run
# Command, so no SSH port needs to be opened to GitHub.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::<account>:role/GitHubActions-gde-example-deploy
#   EC2_INSTANCE_ID      i-xxxxxxxxxxxxxxxxx
name: Build & Deploy
run-name: "${{ github.event_name == 'pull_request' && 'Test' || 'Deploy' }}: ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual run' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nova-assistant

# Never run two deployments at the same time; queue them instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ build + test
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write          # needed to request the OIDC token for AWS
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python -m py_compile app.py auth.py context.py db.py quota.py

      - name: Image tag
        id: meta
        run: echo "tag=git-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --pull -t nova-assistant:ci .

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 nova-assistant:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/healthz >/dev/null && break
            sleep 2
          done
          check() {  # check <path> <expected status>
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$1")
            echo "GET $1 -> $code (expected $2)"
            [ "$code" = "$2" ]
          }
          check /healthz 200
          check / 302
          check /login 200
          check /signup 200
          check /api/conversations 401
          docker exec smoke flask --app app --help | grep -q create-user
          [ "$(docker inspect -f '{{.Config.User}}' smoke)" = "appuser" ]

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke || true

      # Everything below only runs for pushes to main (not pull requests).
      - name: Check deploy configuration
        id: config
        if: github.event_name != 'pull_request'
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$INSTANCE" ]; then
            echo "::warning::AWS_DEPLOY_ROLE_ARN / EC2_INSTANCE_ID secrets are not set - skipping push and deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        if: steps.config.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        id: push
        if: steps.config.outputs.ready == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for t in "$TAG" latest; do
            docker tag nova-assistant:ci "$REGISTRY/$ECR_REPOSITORY:$t"
            docker push -q "$REGISTRY/$ECR_REPOSITORY:$t"
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "### Pushed \`$ECR_REPOSITORY:$TAG\` (+ \`latest\`)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ deploy
  deploy:
    name: Deploy to EC2
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Check the instance is reachable via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          status=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          echo "SSM status: $status"
          if [ "$status" != "Online" ]; then
            echo "::error::The instance is not online in SSM. Is it running, and does its role include AmazonSSMManagedInstanceCore?"
            exit 1
          fi

      - name: Run deploy script on the instance
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # Ship the deploy script from this commit and run it with the new tag.
          script_b64=$(base64 -w0 scripts/deploy-on-ec2.sh)
          jq -n --arg b64 "$script_b64" --arg tag "$TAG" '{
            commands: [
              "set -e",
              ("echo " + $b64 + " | base64 -d > /home/ec2-user/deploy-nova.sh"),
              "chmod 755 /home/ec2-user/deploy-nova.sh && chown ec2-user:ec2-user /home/ec2-user/deploy-nova.sh",
              ("/home/ec2-user/deploy-nova.sh " + $tag)
            ],
            executionTimeout: ["600"]
          }' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy nova-assistant:$TAG (${GITHUB_SHA::7})" \
            --parameters file://params.json \
            --timeout-seconds 120 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Wait for the command to finish (up to 10 minutes).
          status=Pending
          for i in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- output from the instance -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)
          if [ -n "$err" ] && [ "$err" != "None" ]; then
            echo "----- stderr -----"; echo "$err"
          fi

          echo "Deploy status: $status"
          if [ "$status" != "Success" ]; then
            echo "::error::Deployment failed ($status). The script rolls back to the previous image automatically."
            exit 1
          fi
          echo "### Deployed \`$ECR_REPOSITORY:$TAG\` to EC2 :rocket:" >> "$GITHUB_STEP_SUMMARY"
